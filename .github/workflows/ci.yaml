name: Quality Assurance & Package Deployments

on:
  pull_request: null
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-check:
    name: Run Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  nix-flake-check:
    name: Run Nix checks
    needs: clippy-check
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check
        run: nix flake check . --print-build-logs

  nighly-builds:
    name: Nightly builds
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Nightly builds
        run: |
          mkdir artifacts
          for f in $(nix build --print-build-logs --print-out-paths .#packages.x86_64-linux.daisyway-deb .#packages.x86_64-linux.daisyway-tar); do cp "$f" "artifacts/${f#*-}"; done
          echo >&2
          echo >&2 "Generated artifacts:"
          find ./artifacts >&2
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build
          path: artifacts/*
